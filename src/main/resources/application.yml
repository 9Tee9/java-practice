spring:
  jpa:
    open-in-view: false
    generate-ddl: true
    hibernate:
      ddl-auto: create
  datasource:
    url: jdbc:postgresql://localhost:5432/shop2_db
    username: postgres
    password: postgres
    hikari:
      schema: shop2_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS shop2_schema
      connection-timeout: 10000