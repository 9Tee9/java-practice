services:
  orders-service:
    image: orders-service
    build:
      context: ./orders-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 193.233.193.42:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-group
    ports:
      - "8081:8081"


  payment-service:
    image: payment-service
    build:
      context: ./payment-service
