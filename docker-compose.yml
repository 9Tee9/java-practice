      SPRING_KAFKA_BOOTSTRAP_SERVERS: 193.233.193.42:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: shipping-group
    ports:
      - "8083:8083"

  notifications-service:
    image: notifications-service
    build:
      context: ./notifications-service
